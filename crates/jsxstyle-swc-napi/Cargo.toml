[package]
name = "jsxstyle-swc-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
jsxstyle-swc-core = { path = "../jsxstyle-swc-core" }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }
indexmap = "2"
swc_core = { workspace = true, features = [
    "ecma_ast",
    "ecma_visit",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_codegen",
    "ecma_transforms",
    "common",
    "common_sourcemap",
] }

[build-dependencies]
napi-build = { workspace = true }
