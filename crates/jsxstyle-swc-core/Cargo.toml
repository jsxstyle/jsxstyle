[package]
name = "jsxstyle-swc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swc_core = { workspace = true, features = [
    "ecma_ast",
    "ecma_visit",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_codegen",
    "ecma_utils",
    "common",
    "common_sourcemap",
] }
indexmap = "2"
rustc-hash = "2"

[dev-dependencies]
swc_core = { workspace = true, features = [
    "testing_transform",
    "testing",
] }
