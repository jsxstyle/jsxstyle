[workspace]
members = [
    "jsxstyle-swc-core",
    "jsxstyle-swc-napi",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jsxstyle/jsxstyle"
publish = false

[workspace.dependencies]
# SWC core -- features selected per-crate
swc_core = "68.0.2"
# NAPI-RS bindings
napi = { version = "3", default-features = false, features = ["napi9", "serde-json"] }
napi-derive = "3"
napi-build = "2"
# Serialization for plugin config
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 1
